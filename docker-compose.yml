# Local development services. PostgreSQL runs natively; this file only
# provides Mailpit, which catches outgoing email.
#
#   docker compose up -d mailpit
#   web UI: http://localhost:8025   SMTP: localhost:1025 (SMTP_HOST=localhost, SMTP_PORT=1025)
services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
